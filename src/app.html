<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0c12" />
		<meta name="google-site-verification" content="google206ec0c35328040e" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="preconnect" href="https://cdn.spatia.ar" crossorigin />
		<link rel="preload" href="https://cdn.spatia.ar/data/radio_stats_master.parquet" as="fetch" crossorigin />
		<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

		<!-- Keep above the SEO tags: a route's <Seo> lands here and the first title/
		     description/og:* wins. Moving it back below silently un-fixes every page. -->
		%sveltekit.head%

		<!-- Homepage's own tags, and the fallback for it: `/` is ssr=false so it cannot
		     prerender a <svelte:head>. Routes with one override these by position. -->
		<title>nealab — análisis geoespacial · NEA</title>
		<meta name="description" content="Análisis de datos satelitales, censales y ambientales sobre el noreste argentino y sus regiones transfronterizas (Paraguay y sur de Brasil), en grilla hexagonal H3. Acceso abierto." />
		<meta property="og:title" content="nealab — análisis geoespacial" />
		<meta property="og:description" content="Análisis de datos satelitales, censales y ambientales sobre el noreste argentino y sus regiones transfronterizas (Paraguay y sur de Brasil), en grilla hexagonal H3. Acceso abierto." />
		<meta property="og:url" content="https://spatia.ar" />

		<!-- Identical site-wide, so no route duplicates them. -->
		<meta property="og:image" content="https://spatia.ar/og-image.png" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
