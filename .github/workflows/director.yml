name: Director de Spatia

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'humo | diagnostico | completo'
        default: humo
      base:
        description: 'URL a sondear'
        default: 'https://neahub.pages.dev'

permissions:
  contents: read

jobs:
  humo:
    if: github.repository == 'debianalt/spatia-dev' && inputs.modo == 'humo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - run: |
          nohup npx vite preview --port 5173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
      - run: cd director/sondas && python humo.py http://localhost:5173 ../../out/local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: humo
          path: out/
