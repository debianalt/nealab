name: Update Satellite Analyses (Itapúa — Group B)
# agri_potential for Itapúa (PY)

# Sin cron (29-oct-2026): agri_potential: insumos fijos (suelo, clima medio, pendiente); el cron quincenal no aportaba y, con upload_to_r2 arreglado, publicaría sin revisión. Manual.
on:
  workflow_dispatch:
    inputs:
      analyses:
        description: 'Comma-separated analysis IDs (default: all group B)'
        default: 'agri_potential'

jobs:
  update:
    # Solo en el repo privado: el mirror publico (debianalt/nealab) no tiene secrets.
    if: github.repository == 'debianalt/spatia-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          npm install -g wrangler

      - name: Ensure H3 grid + admin crosswalk (R2 cache → regenerate fallback)
        run: |
          python pipeline/grid_cache.py --pull --territory itapua_py || true
          if [ ! -f pipeline/output/itapua_py/hexagons.geojson ] && [ ! -f pipeline/output/itapua_py/hexagons-lite.geojson ]; then
            echo "::warning::grid not in R2 cache, regenerating from GADM source"
            if [ ! -f pipeline/data/gadm41_PRY_2.shp ]; then
              mkdir -p pipeline/data
              curl -sL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 https://geodata.ucdavis.edu/gadm/gadm4.1/shp/gadm41_PRY_shp.zip -o pipeline/data/gadm41_PRY_shp.zip
              (cd pipeline/data && unzip -o gadm41_PRY_shp.zip "gadm41_PRY_2*" >/dev/null)
            fi
            python pipeline/build_admin_crosswalk.py --territory itapua_py --source gadm \
              --shapefile pipeline/data/gadm41_PRY_2.shp
            python pipeline/grid_cache.py --push --territory itapua_py || echo "::warning::failed to seed R2 grid cache"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run Itapúa pixel pipeline
        run: |
          python pipeline/run_itapua_pipeline.py \
            --only ${{ github.event.inputs.analyses || 'agri_potential' }} \
            --upload
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-pixel-b-itapua
          path: |
            pipeline/output/itapua_py/sat_agri_potential.parquet
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "::error::Itapúa Group B pipeline failed."
