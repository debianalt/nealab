name: Update Temporal Baselines (Current vs Baseline)
# Schedule disabled: TEMPORAL_ANALYSES is empty after 2026-05-31 catalog cleanup.
# The pipeline exits cleanly when invoked with no analyses. Re-enable schedule
# once a temporal-compatible analysis is added to TEMPORAL_ANALYSES.

on:
  workflow_dispatch:
    inputs:
      analyses:
        description: 'Comma-separated analysis IDs (or all — currently no-op)'
        default: 'all'
      include_baseline:
        description: 'Also export baseline from GEE (first run or re-calibration)'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          npm install -g wrangler

      - name: Generate H3 grid (if needed)
        run: |
          if [ ! -f pipeline/output/hexagons-lite.geojson ]; then
            python pipeline/generate_h3_grid.py
            python pipeline/simplify_geojson.py
          fi

      - name: Run temporal update pipeline
        run: |
          python pipeline/run_temporal_update.py \
            --analyses ${{ github.event.inputs.analyses || 'all' }} \
            ${{ github.event.inputs.include_baseline == 'true' && '--include-baseline' || '' }}
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-temporal
          path: |
            pipeline/output/sat_*.parquet
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "::error::Temporal satellite pipeline failed."
